[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workagent-rsi"
version = "0.1.0"
description = "Benchmark-driven recursive skill improvement for Office agents"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0", "PyYAML>=6.0", "openpyxl>=3.1", "python-docx>=1.2", "python-pptx>=1.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
